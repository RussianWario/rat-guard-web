<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
            --star-color: #5dade2; /* Синий цвет для звезд */
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            -webkit-user-select: none; 
            user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 100px 20px;
            box-sizing: border-box;
            gap: 15px;
        }

        .stats-panel {
            text-align: center;
            width: 100%;
        }

        /* Новая флекс-строка для разделения Ника и Звезд в углу */
        .stats-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        #username { 
            margin: 0; 
            font-size: 20px; 
            color: var(--accent-color); 
            opacity: 0.8; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        /* Стиль для плашки Звезд в правом верхнем углу панели */
        .top-stars-badge {
            background: #000;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid var(--star-color);
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(93, 173, 226, 0.2);
            text-shadow: 0 0 10px rgba(93, 173, 226, 0.5);
        }

        .level-badge {
            background: rgba(241, 196, 15, 0.15);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
        }

        .points { 
            font-size: 56px; 
            color: var(--text-main); 
            margin: 10px 0 5px 0; 
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
        }

        #clicker-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #rat-button {
            width: 100%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.6));
        }

        #rat-button:active { transform: scale(0.90); }

        #click-animation-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .plus-one {
            position: absolute;
            font-weight: 900;
            font-size: 32px;
            opacity: 0;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.8) rotate(15deg); opacity: 0; }
        }

        .error-msg { color: #e74c3c; font-size: 12px; height: 15px; margin-top: 5px; font-weight: bold; }
        
        .action-buttons-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 300px;
            justify-content: center;
            margin-top: 5px;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s ease;
            flex: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
        }

        .action-btn:active {
            transform: scale(0.95);
            border-color: var(--accent-color);
        }

        .footer-hint {
            color: #444;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .bottom-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            padding: 10px 20px 25px 20px;
            background: var(--card-bg);
            border-top: 1px solid #333;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid #333;
            cursor: pointer;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item.active { border-color: var(--accent-color); background: #222; }
        .nav-item:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-panel">
            <div class="stats-header-row">
                <h2 id="username">Загрузка...</h2>
                <div class="top-stars-badge">⭐ <span id="lbl-stars">0</span></div>
            </div>
            
            <div class="level-badge">ЛОГОВО: <span id="lbl-level">1</span> УРОВЕНЬ</div>
            <div class="points">🧀 <span id="points">0</span></div>
            <div id="error-log" class="error-msg"></div>
        </div>

        <div id="clicker-container">
            <img src="rat_button.png" alt="КРЫСА" id="rat-button" onerror="this.src='https://img.icons8.com/isometric/200/rat.png'">
            <div id="click-animation-area"></div>
        </div>

        <div class="action-buttons-row">
            <button class="action-btn" onclick="openUpgrades()">🛠️ УЛУЧШЕНИЯ</button>
            <button class="action-btn" onclick="openQuests()">🎯 КВЕСТЫ</button>
        </div>

        <div class="footer-hint">Тапай без остановки!</div>
    </div>

    <div class="bottom-grid">
        <div class="nav-item" onclick="goToPath('index.html')">
            <i>🏠</i><span>ДОМ</span>
        </div>
        <div class="nav-item" onclick="goToPath('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item active">
            <i>🕹️</i><span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0f0f0f');

        if (tg.BackButton) {
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                goToPath('games_menu.html');
            });
        }

        function goToPath(path) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            window.location.href = path;
        }

        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        const user = tg.initDataUnsafe?.user;
        
        const pointsSpan = document.getElementById('points');
        const levelSpan = document.getElementById('lbl-level');
        const starsSpan = document.getElementById('lbl-stars');
        const ratBtn = document.getElementById('rat-button');
        const errorLog = document.getElementById('error-log');

        if (user) {
            document.getElementById('username').innerText = user.first_name;
        }

        async function loadProfile() {
            if (!user?.id) {
                document.getElementById('username').innerText = "Тестовая Крыса";
                return;
            }
            try {
                const tgUsername = user.username || 'rat_user';
                const response = await fetch(`${BACKEND_URL}/get_profile/${user.id}?username=${tgUsername}&t=${Date.now()}`);
                
                if (!response.ok) throw new Error("Ошибка сервера");
                
                const data = await response.json();
                if (data.points !== undefined) {
                    document.getElementById('username').innerText = user.first_name;
                    pointsSpan.innerText = Math.floor(data.points).toLocaleString('ru-RU');
                    if (levelSpan) levelSpan.innerText = data.level || 1;
                    if (starsSpan) starsSpan.innerText = (data.stars || 0).toLocaleString('ru-RU');
                }
            } catch (e) {
                console.error(e);
                if (errorLog) errorLog.innerText = "Логово временно недоступно";
                document.getElementById('username').innerText = user.first_name || "Крыса";
            }
        }

        async function handleTap(e) {
            let currentPoints = parseInt(pointsSpan.innerText.replace(/\s/g, '')) || 0;
            pointsSpan.innerText = (currentPoints + 1).toLocaleString('ru-RU');
            
            spawnCheese(e);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            try {
                const res = await fetch(`${BACKEND_URL}/click/${user.id}`, { method: 'POST' });
                const data = await res.json();
                if (data.points !== undefined) {
                    pointsSpan.innerText = Math.floor(data.points).toLocaleString('ru-RU');
                    if (levelSpan) levelSpan.innerText = data.level || 1;
                    if (starsSpan) starsSpan.innerText = (data.stars || 0).toLocaleString('ru-RU');
                }
            } catch (err) {
                console.error("Sync error");
            }
        }

        function spawnCheese(e) {
            const area = document.getElementById('click-animation-area');
            if (!area) return;
            const plus = document.createElement('div');
            plus.className = 'plus-one';
            plus.innerText = '🧀';
            
            const rect = area.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) ? ((e.clientX || e.touches[0].clientX) - rect.left) : (rect.width / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) ? ((e.clientY || e.touches[0].clientY) - rect.top) : (rect.height / 2);

            plus.style.left = `${x - 15}px`;
            plus.style.top = `${y - 15}px`;

            area.appendChild(plus);
            setTimeout(() => plus.remove(), 700);
        }

        if (ratBtn) {
            ratBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleTap(e.touches[0]);
            });
            
            ratBtn.addEventListener('click', (e) => {
                if (e.pointerType !== 'touch') handleTap(e);
            });
        }

        function openUpgrades() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            alert("Улучшения будут доступны в следующем модуле!");
        }

        function openQuests() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            alert("Квесты будут доступны в следующем модуле!");
        }

        loadProfile();
    </script>
</body>
</html>
