<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #bbb;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .user-info { display: flex; align-items: center; gap: 12px; }
        
        .user-avatar-container {
            width: 45px;
            height: 45px;
            position: relative;
        }

        .user-avatar { 
            width: 100%; height: 100%; background: #3498db; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; overflow: hidden; border: 2px solid var(--accent-color);
        }

        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .balance-pill {
            background: #111;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            max-width: 500px;
        }

        .menu-item {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: transform 0.1s, border-color 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .menu-item:active { transform: scale(0.95); border-color: var(--accent-color); }
        .menu-item span { font-weight: bold; font-size: 13px; text-transform: uppercase; }
        .menu-item .desc { font-size: 9px; color: var(--text-dim); }

        /* Кнопка КЛИКЕРА (Акцент на геймплей) */
        .main-btn { 
            grid-column: span 2; 
            background: linear-gradient(145deg, #2c2c2c, #1e1e1e); 
            border: 1px solid var(--accent-color);
            padding: 25px;
            margin-bottom: 5px;
        }

        .news-banner {
            width: calc(100% - 40px);
            max-width: 460px;
            background: #2ecc71;
            color: black;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
        }

        #error-log { color: #e74c3c; font-size: 12px; padding: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="user-avatar-container">
                <div class="user-avatar" id="user-avatar-content">?</div>
            </div>
            <div>
                <div id="username" style="font-weight: bold;">Загрузка...</div>
                <div style="font-size: 10px; color: var(--text-dim);">Ранг: Обычная крыса</div>
            </div>
        </div>
        <div class="balance-pill">🧀 <span id="global-points">0</span></div>
    </div>

    <div class="news-banner">
        🔥 Раздача 27,950 VP скоро начнется!
    </div>

    <div class="menu-grid">
        <!-- КЛИКЕР ОТДЕЛЬНО -->
        <div class="menu-item main-btn" onclick="openModule('clicker.html')">
            <span style="font-size: 16px;">🖱️ В ОБОРОНУ (КЛИКЕР)</span>
            <div class="desc">Защищай склады и собирай сыр</div>
        </div>

        <!-- КОЛЕСО -->
        <div class="menu-item" onclick="alert('Скоро: Колесо Фортуны!')">
            <span>🎡 КОЛЕСО УДАЧИ</span>
            <div class="desc">Испытай везение</div>
        </div>

        <!-- КВЕСТЫ -->
        <div class="menu-item" onclick="alert('Скоро: Задания!')">
            <span>📅 КВЕСТЫ</span>
            <div class="desc">Ежедневные награды</div>
        </div>

        <!-- ТОП -->
        <div class="menu-item" onclick="openModule('leaderboard.html')">
            <span>🏆 ТОП БАНДЫ</span>
            <div class="desc">Лидеры Логова</div>
        </div>

        <!-- МАГАЗИН -->
        <div class="menu-item" onclick="alert('Скоро: Магазин!')">
            <span>🛒 МАГАЗИН</span>
            <div class="desc">Бусты и скины</div>
        </div>
    </div>

    <div id="error-log"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.headerColor = '#1e1e1e';

        if (tg.BackButton) tg.BackButton.hide();

        const user = tg.initDataUnsafe?.user;
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';

        if (user) {
            document.getElementById('username').innerText = user.username || user.first_name;
        }

        async function fetchGlobalData() {
            if (!user?.id) return;
            try {
                const displayName = user.username || user.first_name;
                const url = `${BACKEND_URL}/get_profile/${user.id}?username=${encodeURIComponent(displayName)}&t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.points !== undefined) {
                    document.getElementById('global-points').innerText = data.points;
                }

                const avatarContent = document.getElementById('user-avatar-content');
                if (data.avatar_url) {
                    avatarContent.innerHTML = `<img src="${data.avatar_url}" alt="ava">`;
                    avatarContent.style.background = "transparent";
                } else {
                    avatarContent.innerText = (user.first_name || "К").charAt(0).toUpperCase();
                }
            } catch (e) {
                console.error("Ошибка API:", e);
                document.getElementById('user-avatar-content').innerText = (user.first_name || "К").charAt(0).toUpperCase();
            }
        }

        function openModule(url) {
            window.location.href = url;
        }

        fetchGlobalData();
    </script>
</body>
</html>
