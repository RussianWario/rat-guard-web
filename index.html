<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            -webkit-user-select: none; 
            user-select: none;
            overflow: hidden;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 15px; 
            width: 320px; 
            text-align: center; 
            border: 1px solid #333; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h2 { margin-top: 0; margin-bottom: 5px; font-size: 20px; color: #f1c40f; }
        
        .points { 
            font-size: 36px; 
            color: #f1c40f; 
            margin: 5px 0 10px 0; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .energy-container {
            width: 90%;
            background: #333;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #f39c12);
            transition: width 0.3s ease;
        }

        .energy-text {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
        }

        .inventory { 
            background: #111; 
            padding: 8px; 
            border-radius: 8px; 
            font-size: 12px; 
            color: #bbb; 
            width: 90%;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .leaderboard-section {
            width: 90%;
            margin-bottom: 15px;
            background: #111;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
        }
        .leaderboard-title {
            font-size: 10px;
            color: #666;
            text-align: left;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .leader-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 4px 0;
            border-bottom: 1px solid #222;
        }
        .leader-row:last-child { border-bottom: none; }
        .gold { color: #f1c40f; font-weight: bold; }

        #clicker-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }

        #rat-button {
            max-width: 85%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            display: block;
        }

        #rat-button:active { transform: scale(0.96); }

        #click-animation-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .plus-one {
            position: absolute;
            font-weight: bold;
            color: #ffd700;
            font-size: 24px;
            opacity: 0;
            animation: moveUpAndFade 1s ease-out forwards;
        }

        @keyframes moveUpAndFade {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        #error-log { color: #e74c3c; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        
        <div class="energy-container">
            <div id="energy-bar"></div>
        </div>
        <div class="energy-text">⚡️ <span id="energy-val">1000</span> / <span id="energy-max">1000</span></div>

        <div id="inventory" class="inventory">Инвентарь пуст</div>

        <div class="leaderboard-section">
            <div class="leaderboard-title">Топ банды (141 участник)</div>
            <div id="leaderboard-list">
                <div style="font-size: 11px; color: #444;">Синхронизация...</div>
            </div>
        </div>

        <div id="clicker-container">
            <img src="rat_button.png" alt="Collect Cheese" id="rat-button">
            <div id="click-animation-area"></div>
        </div>

        <div id="error-log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем на весь экран

        const user = tg.initDataUnsafe?.user;
        // КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: Убрали твой личный ID как значение по умолчанию
        const userId = user?.id; 
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        
        const pointsSpan = document.getElementById('points');
        const energyBar = document.getElementById('energy-bar');
        const energyVal = document.getElementById('energy-val');
        const ratBtn = document.getElementById('rat-button');
        const animArea = document.getElementById('click-animation-area');
        const listContainer = document.getElementById('leaderboard-list');
        
        let currentEnergy = 1000;
        let maxEnergy = 1000;

        document.getElementById('username').innerText = user?.first_name || "Крыса-тян";

        async function loadData() {
            if (!userId) {
                document.getElementById('error-log').innerText = "Ошибка: Запустите приложение через Telegram бота.";
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/get_profile/${userId}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`Profile Error: ${response.status}`);
                const data = await response.json();
                
                pointsSpan.innerText = data.points || 0;
                currentEnergy = data.energy || 0;
                maxEnergy = data.max_energy || 1000;
                updateEnergyUI();

                const inv = data.inventory;
                document.getElementById('inventory').innerText = (inv && Array.isArray(inv) && inv.length > 0) 
                    ? inv.join(', ') 
                    : "Инвентарь пуст";

                const topRes = await fetch(`${BACKEND_URL}/leaderboard`);
                const topData = await topRes.json();

                if (topData && Array.isArray(topData)) {
                    listContainer.innerHTML = '';
                    topData.slice(0, 5).forEach((player, index) => {
                        const row = document.createElement('div');
                        row.className = `leader-row ${index === 0 ? 'gold' : ''}`;
                        row.innerHTML = `<span>${index + 1}. ${player.username}</span><span>${player.points} 🧀</span>`;
                        listContainer.appendChild(row);
                    });
                }
            } catch (err) {
                document.getElementById('error-log').innerText = "Data error: " + err.message;
            }
        }

        function updateEnergyUI() {
            energyVal.innerText = Math.floor(currentEnergy);
            const percent = (currentEnergy / maxEnergy) * 100;
            energyBar.style.width = `${percent}%`;
        }

        setInterval(() => {
            if (currentEnergy < maxEnergy) {
                currentEnergy = Math.min(maxEnergy, currentEnergy + 2);
                updateEnergyUI();
            }
        }, 1000);

        async function handleRatClick() {
            if (!userId || currentEnergy < 1) return;

            currentEnergy -= 1;
            let pts = parseInt(pointsSpan.innerText);
            pointsSpan.innerText = pts + 1;
            updateEnergyUI();
            showClickAnimation();

            try {
                const response = await fetch(`${BACKEND_URL}/click/${userId}`, { method: 'POST' });
                if (!response.ok) throw new Error('Click error');
                const data = await response.json();
                
                if (data.points !== undefined) pointsSpan.innerText = data.points;
                if (data.energy !== undefined) {
                    currentEnergy = data.energy;
                    updateEnergyUI();
                }
            } catch (e) {
                document.getElementById('error-log').innerText = "Click error: " + e.message;
            }
        }

        function showClickAnimation() {
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';
            plusOne.style.left = `calc(50% + ${Math.random() * 80 - 40}px)`;
            plusOne.style.top = `40%`; 
            animArea.appendChild(plusOne);
            setTimeout(() => { plusOne.remove(); }, 1000);
        }

        ratBtn.addEventListener('click', handleRatClick);
        loadData();
    </script>
</body>
</html>
