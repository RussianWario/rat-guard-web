<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg-color: #0f0f0f; 
            --card-bg: #1a1a1a; 
            --accent-color: #f1c40f; 
            --text-main: #ffffff; 
            --text-dim: #888;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            padding: 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
            text-align: center;
        }

        .header h2 { 
            margin: 0; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--accent-color);
        }

        .games-list {
            flex-grow: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px; /* Отступ под меню */
        }

        .game-card {
            background: var(--card-bg); 
            border-radius: 18px; 
            padding: 16px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border: 1px solid #222; 
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card:active:not(.locked) { 
            transform: scale(0.97); 
            border-color: var(--accent-color); 
        }

        .game-icon { 
            font-size: 30px; 
            background: #000;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px solid #333;
        }

        .game-info { flex-grow: 1; }
        .game-info b { display: block; font-size: 16px; margin-bottom: 2px; }
        .game-info span { font-size: 11px; color: var(--text-dim); line-height: 1.2; display: block; }

        /* Состояния */
        .locked { opacity: 0.6; grayscale: 1; cursor: default; }
        
        .status-badge {
            font-size: 8px;
            background: #333;
            color: #aaa;
            padding: 3px 7px;
            border-radius: 6px;
            margin-top: 6px;
            display: inline-block;
            font-weight: bold;
            text-transform: uppercase;
        }

        .play-hint {
            font-size: 18px;
            color: var(--accent-color);
            opacity: 0.5;
        }

        /* ФИКСИРОВАННОЕ МЕНЮ (4 кнопки) */
        .bottom-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            padding: 10px 20px 25px 20px;
            background: var(--card-bg);
            border-top: 1px solid #333;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item:active, .nav-item.active { border-color: var(--accent-color); background: #222; transform: scale(0.95); }
        .nav-item.active span { color: var(--accent-color); }

    </style>
</head>
<body>

    <div class="header">
        <h2>Игровая Зона</h2>
    </div>

    <div class="games-list">
        <!-- КЛИКЕР -->
        <div class="game-card" onclick="openModule('clicker.html')">
            <div class="game-icon">🧀</div>
            <div class="game-info">
                <b>Сырный Кликер</b>
                <span>Защищай склады и собирай запасы</span>
            </div>
            <div class="play-hint">▶</div>
        </div>

        <!-- САПЕР -->
        <div class="game-card locked" onclick="tg.HapticFeedback.notificationOccurred('warning')">
            <div class="game-icon">💣</div>
            <div class="game-info">
                <b>Сырный Сапер</b>
                <span>Найди деликатес и не подорвись</span>
                <div class="status-badge">В разработке</div>
            </div>
        </div>

        <!-- БАШНЯ -->
        <div class="game-card locked" onclick="tg.HapticFeedback.notificationOccurred('warning')">
            <div class="game-icon">🏢</div>
            <div class="game-info">
                <b>Сырная Башня</b>
                <span>Строй вертикальное Крысиное Логово</span>
                <div class="status-badge">В разработке</div>
            </div>
        </div>
    </div>

    <!-- МЕНЮ НАВИГАЦИИ -->
    <div class="bottom-grid">
        <div class="nav-item" onclick="openModule('index.html')">
            <i>🏠</i><span>ХАБ</span>
        </div>
        <div class="nav-item" onclick="openModule('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item active" onclick="openModule('games_menu.html')">
            <i>🕹️</i><span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Магазин откроется скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1a1a1a');

        function openModule(url) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            window.location.href = url;
        }

        // Эффект при клике на заблокированные игры
        document.querySelectorAll('.locked').forEach(card => {
            card.addEventListener('click', () => {
                tg.HapticFeedback.notificationOccurred('warning');
            });
        });

        // Скрываем кнопку назад, так как теперь есть удобное меню
        tg.BackButton.hide();
    </script>
</body>
</html>
