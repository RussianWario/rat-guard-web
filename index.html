<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rat_Guard Profile</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: var(--tg-theme-secondary-bg-color, #2c2c2c);
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin-top: 0; color: var(--tg-theme-button-color, #3498db); }
        .points {
            font-size: 32px;
            font-weight: bold;
            color: #f1c40f;
            margin: 15px 0;
        }
        .inventory {
            font-size: 14px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 10px;
            min-height: 40px;
            margin-bottom: 20px;
        }
        button {
            background: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        <p>Ваш инвентарь:</p>
        <div class="inventory" id="inventory">Загрузка предметов...</div>
        <button onclick="tg.close()">Закрыть профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || 12345; // 12345 для тестов в браузере
        const firstName = user?.first_name || "Пользователь";

        document.getElementById('username').innerText = firstName;

        // Функция запроса к твоему API на Render
        async function fetchProfile() {
            try {
                // Используем твой рабочий URL
                const response = await fetch(`https://rat-guard-api.onrender.com/get_profile/${userId}`);
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();
                
                // Обновляем данные на странице
                document.getElementById('points').innerText = data.points;
                const inv = data.inventory;
                document.getElementById('inventory').innerText = inv.length > 0 ? inv.join(', ') : 'Тут пока пусто...';
            } catch (error) {
                console.error("Ошибка:", error);
                document.getElementById('inventory').innerText = "Не удалось загрузить данные.";
            }
        }

        // Запускаем загрузку
        fetchProfile();
    </script>
</body>
</html>
