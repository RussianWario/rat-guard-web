<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад крысы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #2c2c2c; padding: 25px; border-radius: 15px; width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .points { font-size: 32px; color: #f1c40f; margin: 15px 0; }
        .inventory { background: #111; padding: 10px; border-radius: 8px; font-size: 14px; min-height: 40px; }
        button { background: #3498db; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Твой инвентарь:</div>
        <div class="inventory" id="inventory">Загрузка...</div>
        <button onclick="window.Telegram.WebApp.close()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function fetchProfile() {
            const user = tg.initDataUnsafe?.user;
            const userId = user?.id || 12345;
            const firstName = user?.first_name || "Крыса";

            try {
                const response = await fetch(`https://rat-guard-api.onrender.com/get_profile/${userId}`);
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                
                document.getElementById('username').innerText = firstName;
                document.getElementById('points').innerText = data.points;
                
                // Отображение предметов через запятую
                const items = data.inventory;
                document.getElementById('inventory').innerText = 
                    Array.isArray(items) && items.length > 0 
                    ? items.join(', ') 
                    : 'Тут пока пусто...';
            } catch (e) {
                document.getElementById('inventory').innerText = "Ошибка загрузки данных.";
            }
        }
        fetchProfile();
    </script>
</body>
</html>
