<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            /* Запрещаем выделение текста при кликах */
            -webkit-user-select: none; 
            user-select: none;
            overflow: hidden; /* Запрещаем скролл всей страницы */
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 15px; 
            width: 320px; 
            text-align: center; 
            border: 1px solid #333; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h2 { margin-top: 0; margin-bottom: 5px; font-size: 20px; }
        
        .points { 
            font-size: 36px; 
            color: #f1c40f; 
            margin: 5px 0 15px 0; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Стиль для элемента инвентаря */
        .inventory { 
            background: #111; 
            padding: 8px; 
            border-radius: 8px; 
            font-size: 12px; 
            color: #bbb; 
            width: 90%;
            margin-bottom: 20px;
            min-height: 20px;
        }

        /* --- СТИЛИ КЛИКЕРА --- */
        #clicker-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }

        /* Кнопка-крыса */
        #rat-button {
            max-width: 85%; /* Чтобы хорошо смотрелось на всех телефонах */
            cursor: pointer;
            transition: transform 0.05s ease-in-out; /* Быстрая реакция */
            -webkit-tap-highlight-color: transparent; /* Убираем синее выделение */
            z-index: 10;
            display: block; /* Убираем отступы снизу */
        }

        /* Эффект нажатия (сжатие) */
        #rat-button:active {
            transform: scale(0.96); /* Нажатие - сжимаем на 4% */
        }

        /* Зона вылетающей анимации "+1" */
        #click-animation-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы не мешала кликать */
            z-index: 20;
        }

        /* Класс для анимации +1 */
        .plus-one {
            position: absolute;
            font-weight: bold;
            color: #ffd700;
            font-size: 24px;
            opacity: 0;
            animation: moveUpAndFade 1s ease-out forwards;
        }

        @keyframes moveUpAndFade {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        #error-log { color: #e74c3c; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="username">Kawaii Rat...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        <div id="inventory" class="inventory">Вещи загружаются...</div>

        <!-- КОНТЕЙНЕР КЛИКЕРА -->
        <div id="clicker-container">
            <!-- Сама картинка-кнопка -->
            <img src="rat_button.png" alt="Collect Cheese" id="rat-button">
            <!-- Сюда будут вылетать "+1" -->
            <div id="click-animation-area"></div>
        </div>

        <div id="error-log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // Базовые данные пользователя
        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || 393520953; // Для теста, если нет ТГ
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        
        // Элементы
        const pointsSpan = document.getElementById('points');
        const ratBtn = document.getElementById('rat-button');
        const animArea = document.getElementById('click-animation-area');
        
        // 1. Устанавливаем имя сразу
        document.getElementById('username').innerText = user?.first_name || "Крыса-тян";

        // Функция загрузки профиля при старте
        async function loadProfile() {
            try {
                const response = await fetch(`${BACKEND_URL}/get_profile/${userId}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`Server Error: ${response.status}`);
                
                const data = await response.json();
                
                pointsSpan.innerText = data.points;
                
                const inv = data.inventory;
                document.getElementById('inventory').innerText = inv.length > 0 ? inv.join(', ') : "Инвентарь пуст";
            } catch (err) {
                document.getElementById('error-log').innerText = "Load error: " + err.message;
            }
        }

        // --- ЛОГИКА КЛИКА ---
        async function handleRatClick() {
            console.log("Клик по крысе!");
            
            try {
                // 1. Показываем +1 визуально сразу ( моментальный отклик)
                let currentPoints = parseInt(pointsSpan.innerText);
                pointsSpan.innerText = currentPoints + 1;
                showClickAnimation();

                // 2. Стучимся на бэкенд в файл clicker.py (POST запрос)
                const response = await fetch(`${BACKEND_URL}/click/${userId}`, {
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Click error');
                const data = await response.json();
                
                // 3. Синхронизируем счет с базой данных
                if (data.points !== undefined) {
                    pointsSpan.innerText = data.points;
                }
            } catch (e) {
                console.error("Клик не прошел:", e);
                document.getElementById('error-log').innerText = "Click error: " + e.message;
            }
        }

        // Анимация вылетающих "+1"
        function showClickAnimation() {
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';
            
            // Рандомное смещение влево-вправо
            const xOffset = Math.random() * 80 - 40; // +/- 40px от центра
            plusOne.style.left = `calc(50% + ${xOffset}px)`;
            // Стартовая позиция по вертикали
            plusOne.style.top = `40%`; 

            animArea.appendChild(plusOne);

            // Удаляем элемент через 1 секунду (после завершения анимации)
            setTimeout(() => {
                plusOne.remove();
            }, 1000);
        }

        // Привязываем функцию клика к крысе
        // Важно: 'click' в ТГ Mini App работает нормально
        ratBtn.addEventListener('click', handleRatClick);

        // Запускаем загрузку профиля
        loadProfile();
    </script>
</body>
</html>
