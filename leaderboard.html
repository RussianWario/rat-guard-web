<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лидерборд Крыс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            padding: 20px;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h2 { margin: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        #total-users { font-size: 11px; color: var(--accent-color); font-weight: bold; }

        .leader-list {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            padding-bottom: 110px;
        }

        .leader-item {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #222;
        }

        .leader-info { display: flex; align-items: center; gap: 12px; }

        .rank {
            font-weight: 900;
            font-size: 14px;
            width: 28px;
            height: 28px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            border: 1px solid #333;
        }

        .leader-item:nth-child(1) .rank { background: var(--accent-color); color: #000; }
        .leader-item:nth-child(2) .rank { background: #bdc3c7; color: #000; }
        .leader-item:nth-child(3) .rank { background: #cd7f32; color: #000; }

        .name { font-weight: 600; font-size: 14px; color: #eee; }
        .score { font-weight: bold; color: #2ecc71; font-size: 14px; }

        .bottom-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            padding: 10px 20px 25px 20px;
            background: var(--card-bg);
            border-top: 1px solid #333;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid #333;
            cursor: pointer;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item.active { border-color: var(--accent-color); background: #222; }

        .error-msg { color: #e74c3c; text-align: center; margin-top: 50px; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏆 ТОП БАНДЫ</h2>
        <div id="total-users">Крыс в базе: 0</div>
    </div>

    <div id="leader-list" class="leader-list">
        <div style="text-align: center; color: #777; margin-top: 20px;">Считаем сыр в закромах...</div>
    </div>

    <div class="bottom-grid">
        <div class="nav-item" onclick="openModule('index.html')">
            <i>🏠</i><span>ХАБ</span>
        </div>
        <div class="nav-item active" onclick="openModule('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item" onclick="openModule('games_menu.html')">
            <i>🕹️</i><span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const BACKEND_URL = 'https://rat-guard-api.onrender.com';

        async function loadLeaderboard() {
            try {
                // Используем метку времени для обхода кэша
                const response = await fetch(`${BACKEND_URL}/leaderboard?t=${Date.now()}`);
                if (!response.ok) throw new Error("Ошибка загрузки");
                
                const rawData = await response.json();
                
                // На скриншоте image_1f1717.png видно, что приходит массив объектов
                const users = Array.isArray(rawData) ? rawData : (rawData.users || []);
                
                document.getElementById('total-users').innerText = `Крыс в базе: ${users.length}`;
                
                const listContainer = document.getElementById('leader-list');
                listContainer.innerHTML = '';

                if (users.length === 0) {
                    listContainer.innerHTML = '<div style="text-align:center; padding-top:20px;">Пока тут пусто...</div>';
                    return;
                }

                users.forEach((user, index) => {
                    const item = document.createElement('div');
                    item.className = 'leader-item';
                    
                    // Обработка имени
                    let displayName = user.username || "Анонимная крыса";
                    if (displayName.length > 15) displayName = displayName.substring(0, 13) + '...';

                    item.innerHTML = `
                        <div class="leader-info">
                            <span class="rank">${index + 1}</span>
                            <span class="name">${displayName}</span>
                        </div>
                        <span class="score">${Math.floor(user.points || 0).toLocaleString('ru-RU')} 🧀</span>
                    `;
                    listContainer.appendChild(item);
                });

            } catch (e) {
                console.error("Leaderboard Error:", e);
                document.getElementById('leader-list').innerHTML = 
                    '<div class="error-msg">⚠️ Логово временно недоступно. Обнови страницу или загляни позже.</div>';
            }
        }

        function openModule(url) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = url;
        }

        loadLeaderboard();
    </script>
</body>
</html>
