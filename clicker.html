<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            -webkit-user-select: none; 
            user-select: none;
            overflow: hidden;
        }
        
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 15px; 
            width: 320px; 
            text-align: center; 
            border: 1px solid #333; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h2 { margin-top: 0; margin-bottom: 5px; font-size: 20px; color: #f1c40f; }
        
        .points { 
            font-size: 36px; 
            color: #f1c40f; 
            margin: 5px 0 10px 0; 
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .energy-container {
            width: 90%;
            background: #333;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            overflow: hidden;
        }

        #energy-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #f39c12);
            transition: width 0.3s ease;
        }

        .energy-text {
            font-size: 14px;
            color: #bbb;
            margin-bottom: 15px;
        }

        #clicker-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin: 20px 0;
        }

        #rat-button {
            max-width: 85%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            display: block;
        }

        #rat-button:active { transform: scale(0.96); }

        #click-animation-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .plus-one {
            position: absolute;
            font-weight: bold;
            color: #ffd700;
            font-size: 24px;
            opacity: 0;
            animation: moveUpAndFade 1s ease-out forwards;
        }

        @keyframes moveUpAndFade {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100px); opacity: 0; }
        }

        #error-log { color: #e74c3c; font-size: 10px; margin-top: 10px; }

        .back-hint {
            font-size: 10px;
            color: #555;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        
        <div class="energy-container">
            <div id="energy-bar"></div>
        </div>
        <div class="energy-text">⚡️ <span id="energy-val">1000</span> / <span id="energy-max">1000</span></div>

        <div id="clicker-container">
            <!-- Убедись, что файл rat_button.png лежит в той же папке -->
            <img src="rat_button.png" alt="Collect Cheese" id="rat-button">
            <div id="click-animation-area"></div>
        </div>

        <div id="error-log"></div>
        <div class="back-hint">Используй кнопку "Назад" в углу, чтобы выйти в меню</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ВКЛЮЧАЕМ КНОПКУ НАЗАД
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            window.location.href = 'index.html';
        });

        const user = tg.initDataUnsafe?.user;
        const userId = user?.id; 
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        
        const pointsSpan = document.getElementById('points');
        const energyBar = document.getElementById('energy-bar');
        const energyVal = document.getElementById('energy-val');
        const ratBtn = document.getElementById('rat-button');
        const animArea = document.getElementById('click-animation-area');
        
        let currentEnergy = 1000;
        let maxEnergy = 1000;

        document.getElementById('username').innerText = user?.first_name || "Крыса-тян";

        async function loadData() {
            if (!userId) {
                document.getElementById('error-log').innerText = "Ошибка: Запусти через Telegram.";
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/get_profile/${userId}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`Profile Error: ${response.status}`);
                const data = await response.json();
                
                pointsSpan.innerText = data.points || 0;
                currentEnergy = data.energy || 0;
                maxEnergy = data.max_energy || 1000;
                document.getElementById('energy-max').innerText = maxEnergy;
                updateEnergyUI();
            } catch (err) {
                document.getElementById('error-log').innerText = "Ошибка данных: " + err.message;
            }
        }

        function updateEnergyUI() {
            energyVal.innerText = Math.floor(currentEnergy);
            const percent = (currentEnergy / maxEnergy) * 100;
            energyBar.style.width = `${percent}%`;
        }

        // Регенерация энергии (2 единицы в секунду)
        setInterval(() => {
            if (currentEnergy < maxEnergy) {
                currentEnergy = Math.min(maxEnergy, currentEnergy + 2);
                updateEnergyUI();
            }
        }, 1000);

        async function handleRatClick() {
            if (!userId || currentEnergy < 1) return;

            // Визуальный отклик сразу (клиентская часть)
            currentEnergy -= 1;
            let pts = parseInt(pointsSpan.innerText);
            pointsSpan.innerText = pts + 1;
            updateEnergyUI();
            showClickAnimation();

            // Отправка на бэкенд
            try {
                const response = await fetch(`${BACKEND_URL}/click/${userId}`, { method: 'POST' });
                const data = await response.json();
                
                if (data.points !== undefined) pointsSpan.innerText = data.points;
                if (data.energy !== undefined) {
                    currentEnergy = data.energy;
                    updateEnergyUI();
                }
            } catch (e) {
                console.error("Click error:", e);
            }
        }

        function showClickAnimation() {
            const plusOne = document.createElement('div');
            plusOne.classList.add('plus-one');
            plusOne.innerText = '+1';
            plusOne.style.left = `calc(50% + ${Math.random() * 80 - 40}px)`;
            plusOne.style.top = `40%`; 
            animArea.appendChild(plusOne);
            setTimeout(() => { plusOne.remove(); }, 1000);
        }

        ratBtn.addEventListener('click', handleRatClick);
        loadData();
    </script>
</body>
</html>
