<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
            --star-color: #5dade2;
            --xp-color: #2ecc71; /* Цвет полоски опыта */
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            -webkit-user-select: none; 
            user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 100px 20px;
            box-sizing: border-box;
            gap: 10px;
        }

        .stats-panel {
            text-align: center;
            width: 100%;
        }

        .stats-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        #username { 
            margin: 0; 
            font-size: 20px; 
            color: var(--accent-color); 
            opacity: 0.8; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .top-stars-badge {
            background: #000;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid var(--star-color);
            font-weight: bold;
            font-size: 14px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 15px rgba(93, 173, 226, 0.2);
        }

        /* НОВАЯ СИСТЕМА ОПЫТА (UI) */
        .xp-container {
            width: 100%;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 12px;
            box-sizing: border-box;
        }
        
        .xp-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: bold;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .xp-bar-bg {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .xp-bar-fill {
            width: 0%; /* Будет меняться через JS */
            height: 100%;
            background: linear-gradient(90deg, var(--xp-color), #27ae60);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .points { 
            font-size: 48px; 
            color: var(--text-main); 
            margin: 5px 0; 
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: 0 0 25px rgba(241, 196, 15, 0.2);
        }

        #clicker-container {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #rat-button {
            width: 100%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.6));
        }

        #rat-button:active { transform: scale(0.92); }

        #click-animation-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .plus-one {
            position: absolute;
            font-weight: 900;
            font-size: 28px;
            opacity: 0;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
        }

        .error-msg { color: #e74c3c; font-size: 11px; margin-top: 5px; font-weight: bold; min-height: 15px;}
        
        .action-buttons-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            justify-content: center;
        }

        .action-btn {
            background: var(--card-bg);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 14px 0;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .action-btn:active { transform: scale(0.96); border-color: var(--accent-color); }

        .bottom-grid {
            position: fixed; bottom: 0; left: 0;
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; width: 100%; padding: 10px 20px 25px 20px;
            background: var(--card-bg); border-top: 1px solid #333;
            box-sizing: border-box; z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f; border-radius: 12px; padding: 10px 0;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            border: 1px solid #333; cursor: pointer;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item.active { border-color: var(--accent-color); background: #222; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-panel">
            <div class="stats-header-row">
                <h2 id="username">Крыса...</h2>
                <div class="top-stars-badge">⭐ <span id="lbl-stars">0</span></div>
            </div>
            
            <div class="xp-container">
                <div class="xp-info">
                    <span>Уровень <span id="lbl-level">1</span></span>
                    <span id="lbl-xp-text">0 / 100 XP</span>
                </div>
                <div class="xp-bar-bg">
                    <div id="xp-fill" class="xp-bar-fill"></div>
                </div>
            </div>

            <div class="points">🧀 <span id="points">0</span></div>
            <div id="error-log" class="error-msg"></div>
        </div>

        <div id="clicker-container">
            <img src="rat_button.png" alt="КРЫСА" id="rat-button" onerror="this.src='https://img.icons8.com/isometric/200/rat.png'">
            <div id="click-animation-area"></div>
        </div>

        <div class="action-buttons-row">
            <button class="action-btn" onclick="openUpgrades()">🛠️ УЛУЧШЕНИЯ</button>
            <button class="action-btn" onclick="openQuests()">🎯 КВЕСТЫ</button>
        </div>
    </div>

    <div class="bottom-grid">
        <div class="nav-item" onclick="goToPath('index.html')"><i>🏠</i><span>ДОМ</span></div>
        <div class="nav-item" onclick="goToPath('leaderboard.html')"><i>🏆</i><span>ТОП</span></div>
        <div class="nav-item active"><i>🕹️</i><span>ИГРЫ</span></div>
        <div class="nav-item" onclick="alert('Скоро!')"><i>🛒</i><span>МАГАЗИН</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0f0f0f');

        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        window.BACKEND_URL = BACKEND_URL;
        
        const user = tg.initDataUnsafe?.user;
        const pointsSpan = document.getElementById('points');
        const levelSpan = document.getElementById('lbl-level');
        const starsSpan = document.getElementById('lbl-stars');
        const xpFill = document.getElementById('xp-fill');
        const xpText = document.getElementById('lbl-xp-text');
        const errorLog = document.getElementById('error-log');

        if (user) document.getElementById('username').innerText = user.first_name;

        function goToPath(path) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            window.location.href = path;
        }

        // ОБНОВЛЕНИЕ ИНТЕРФЕЙСА (Опыт, Уровень, Звезды)
        function updateUI(data) {
            if (data.points !== undefined) pointsSpan.innerText = Math.floor(data.points).toLocaleString('ru-RU');
            if (data.level !== undefined) levelSpan.innerText = data.level;
            if (data.stars !== undefined) starsSpan.innerText = data.stars.toLocaleString('ru-RU');
            
            // Расчет полоски опыта
            if (data.xp !== undefined && data.xp_to_next_level) {
                const percent = (data.xp / data.xp_to_next_level) * 100;
                xpFill.style.width = percent + '%';
                xpText.innerText = `${data.xp} / ${data.xp_to_next_level} XP`;
            }
        }

        async function loadProfile() {
            if (!user?.id) return;
            try {
                const response = await fetch(`${BACKEND_URL}/get_profile/${user.id}?username=${user.username || 'rat'}`);
                const data = await response.json();
                updateUI(data);
            } catch (e) {
                errorLog.innerText = "Ошибка связи с Логовом";
            }
        }

        async function handleTap(e) {
            // Мгновенный визуальный отзыв
            let currentPoints = parseInt(pointsSpan.innerText.replace(/\s/g, '')) || 0;
            pointsSpan.innerText = (currentPoints + 1).toLocaleString('ru-RU');
            
            spawnCheese(e);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            try {
                const res = await fetch(`${BACKEND_URL}/click/${user.id}`, { method: 'POST' });
                const data = await res.json();
                updateUI(data);
            } catch (err) { console.error("Sync error"); }
        }

        function spawnCheese(e) {
            const area = document.getElementById('click-animation-area');
            const plus = document.createElement('div');
            plus.className = 'plus-one';
            plus.innerText = '🧀';
            const rect = area.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            plus.style.left = `${x}px`;
            plus.style.top = `${y}px`;
            area.appendChild(plus);
            setTimeout(() => plus.remove(), 600);
        }

        const ratBtn = document.getElementById('rat-button');
        ratBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e.touches[0]); });
        ratBtn.addEventListener('click', (e) => { if (e.pointerType !== 'touch') handleTap(e); });

        loadProfile();
    </script>
    <script src="upgrades.js"></script>
    <script src="quests.js"></script>
</body>
</html>
