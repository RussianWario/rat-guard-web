<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад крысы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .profile-card {
            background: #2c2c2c;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin: 0; color: #3498db; font-size: 24px; }
        .points {
            font-size: 36px;
            font-weight: bold;
            color: #f1c40f;
            margin: 20px 0;
        }
        .inventory-label { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .inventory {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 12px;
            min-height: 50px;
            margin-bottom: 25px;
            font-size: 15px;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        <div class="inventory-label">Ваш инвентарь:</div>
        <div class="inventory" id="inventory">Загрузка предметов...</div>
        <button onclick="window.Telegram.WebApp.close()">Закрыть профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || 12345; 
        const firstName = user?.first_name || "Кирисса";

        async function fetchProfile() {
            try {
                // Чистим ID от мусора
                const cleanId = String(userId).split('&')[0].split('?')[0];
                const response = await fetch(`https://rat-guard-api.onrender.com/get_profile/${cleanId}`);
                
                if (!response.ok) throw new Error('Backend error');
                
                const data = await response.json();
                
                document.getElementById('username').innerText = firstName;
                document.getElementById('points').innerText = data.points;
                document.getElementById('inventory').innerText = 
                    data.inventory && data.inventory.length > 0 
                    ? data.inventory.join(', ') 
                    : 'Тут пока пусто...';
            } catch (error) {
                console.error(error);
                document.getElementById('inventory').innerText = "Ошибка загрузки данных.";
                document.getElementById('username').innerText = "Упс!";
            }
        }

        fetchProfile();
    </script>
</body>
</html>
