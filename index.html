<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
            --danger-color: #e74c3c; /* Красный цвет для кнопки выхода */
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
            box-sizing: border-box;
        }

        /* Новая красная кнопка выхода в углу */
        .exit-btn-top {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(231, 76, 60, 0.3);
            transition: all 0.1s ease;
        }

        .exit-btn-top:active {
            transform: scale(0.92);
            background: #c0392b;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { 
            width: 35px; height: 35px; border-radius: 50%; 
            border: 2px solid var(--accent-color); overflow: hidden; 
            display: flex; align-items: center; justify-content: center;
            background: #333; font-weight: bold; font-size: 14px;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .balance {
            background: #000;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid var(--accent-color);
            font-weight: bold;
            color: var(--accent-color);
            display: flex; align-items: center; gap: 5px;
        }

        .character-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 80px;
        }

        .character-container {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float 3s ease-in-out infinite;
        }

        .character-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .games-btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 10px 0;
            position: relative;
            z-index: 5;
        }

        .games-main-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #000;
            width: 85%;
            max-width: 340px;
            padding: 18px;
            border-radius: 25px;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
            cursor: pointer;
            transition: transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .games-main-btn:active { transform: scale(0.96); }

        .bottom-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            padding: 10px 20px 25px 20px;
            background: var(--card-bg);
            border-top: 1px solid #333;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item:active, .nav-item.active { border-color: var(--accent-color); background: #222; transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="header">
        <!-- Кнопка ВЫХОД в левом верхнем углу -->
        <button class="exit-btn-top" onclick="tg.close()">Выход</button>
        
        <div class="user-info">
            <div id="username" style="font-size: 14px; font-weight: bold;">Загрузка...</div>
            <div class="user-avatar" id="user-avatar-content">?</div>
        </div>
        <div class="balance">🧀 <span id="global-points">0</span></div>
    </div>

    <div class="character-section">
        <div class="character-container">
            <img src="https://img.icons8.com/isometric/200/rat.png" alt="Hero"> 
        </div>
        <p style="color: var(--text-dim); font-size: 11px; margin-top: 15px;">Статус: Охраняю склады</p>
        
        <div class="games-btn-container">
            <div class="games-main-btn" onclick="openModule('games_menu.html')">
                <span>🕹️</span> ИГРЫ
            </div>
        </div>
    </div>

    <!-- ЕДИНАЯ НАВИГАЦИЯ -->
    <div class="bottom-grid">
        <div class="nav-item active" onclick="openModule('index.html')">
            <i>🏠</i><span>ДОМ</span>
        </div>
        <div class="nav-item" onclick="openModule('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item" onclick="openModule('games_menu.html')">
            <i>🕹️</i><span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#1a1a1a');
        tg.setBackgroundColor('#0f0f0f');

        // Гарантируем, что кнопка "Назад" скрыта в Хабе
        if (tg.BackButton) {
            tg.BackButton.hide();
        }

        const user = tg.initDataUnsafe?.user;
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';

        if (user) {
            document.getElementById('username').innerText = user.username || user.first_name;
            document.getElementById('user-avatar-content').innerText = (user.first_name || "K").charAt(0).toUpperCase();
        }

        async function fetchGlobalData() {
            if (!user?.id) return;
            try {
                const url = `${BACKEND_URL}/get_profile/${user.id}?username=${encodeURIComponent(user.username || user.first_name)}&t=${Date.now()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                if (data.points !== undefined) {
                    document.getElementById('global-points').innerText = Math.floor(data.points).toLocaleString('ru-RU');
                }
                
                const avatarDiv = document.getElementById('user-avatar-content');
                if (data.avatar_url) {
                    avatarDiv.innerHTML = `<img src="${data.avatar_url}" alt="ava" onerror="handleAvaError()">`;
                }
            } catch (e) { 
                console.error("Ошибка загрузки данных:", e); 
            }
        }

        function handleAvaError() {
            const avatarDiv = document.getElementById('user-avatar-content');
            avatarDiv.innerHTML = (user?.first_name || "K").charAt(0).toUpperCase();
        }

        function openModule(url) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = url;
        }

        fetchGlobalData();
        setInterval(fetchGlobalData, 30000);
    </script>
</body>
</html>
