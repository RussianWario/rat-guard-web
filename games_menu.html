<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Games</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg-color: #0f0f0f; 
            --card-bg: #1a1a1a; 
            --accent-color: #f1c40f; 
            --text-main: #ffffff; 
            --text-dim: #888;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        .title {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0;
            font-size: 20px;
        }

        .games-list {
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-card {
            width: 100%; 
            max-width: 400px; 
            background: var(--card-bg); 
            border-radius: 18px; 
            padding: 20px; 
            margin-bottom: 12px;
            display: flex; 
            align-items: center; 
            gap: 15px; 
            border: 1px solid #222; 
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .game-card:active { 
            transform: scale(0.97); 
            border-color: var(--accent-color); 
        }

        .game-icon { 
            font-size: 35px; 
            background: #111;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .game-info { flex-grow: 1; }
        .game-info b { display: block; font-size: 17px; margin-bottom: 4px; }
        .game-info span { font-size: 11px; color: var(--text-dim); line-height: 1.3; display: block; }

        .locked { opacity: 0.5; cursor: default; }
        .locked:active { transform: none; border-color: #222; }
        
        .status-badge {
            font-size: 9px;
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 5px;
            display: inline-block;
        }

        /* НИЖНЯЯ НАВИГАЦИЯ */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            padding: 10px 10px 25px 10px;
            background: #151515;
            border-top: 1px solid #222;
            box-sizing: border-box;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 5px 0;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); text-transform: uppercase; }
        .active-nav span { color: var(--accent-color); }
        .nav-item:active { opacity: 0.7; }
    </style>
</head>
<body>

    <h2 class="title">Мини-игры</h2>

    <div class="games-list">
        <!-- КЛИКЕР -->
        <div class="game-card" onclick="location.href='clicker.html'">
            <div class="game-icon">🖱️</div>
            <div class="game-info">
                <b>Сырный Кликер</b>
                <span>Защищай склады и собирай запасы</span>
            </div>
        </div>

        <!-- САПЕР -->
        <div class="game-card locked" onclick="tg.HapticFeedback.notificationOccurred('warning')">
            <div class="game-icon">💣</div>
            <div class="game-info">
                <b>Сырный Сапер</b>
                <span>Найди деликатес и не подорвись</span>
                <div class="status-badge">В РАЗРАБОТКЕ</div>
            </div>
        </div>

        <!-- БАШНЯ -->
        <div class="game-card locked" onclick="tg.HapticFeedback.notificationOccurred('warning')">
            <div class="game-icon">🏢</div>
            <div class="game-info">
                <b>Сырная Башня</b>
                <span>Строй вертикальное Крысиное Логово</span>
                <div class="status-badge">В РАЗРАБОТКЕ</div>
            </div>
        </div>
    </div>

    <!-- Быстрая навигация снизу -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="location.href='index.html'"><i>🏠</i><span>ХАБ</span></div>
        <div class="nav-item active-nav"><i>🕹️</i><span>ИГРЫ</span></div>
        <div class="nav-item" onclick="alert('Скоро!')"><i>📅</i><span>КВЕСТЫ</span></div>
        <div class="nav-item" onclick="location.href='leaderboard.html'"><i>🏆</i><span>ТОП</span></div>
        <div class="nav-item" onclick="alert('Скоро!')"><i>🛒</i><span>МАГАЗИН</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Кнопка назад в интерфейсе Телеграм на всякий случай остается
        tg.BackButton.show();
        tg.BackButton.onClick(() => { 
            window.location.href = 'index.html'; 
        });

        // Вибрация для активных игр
        document.querySelectorAll('.game-card:not(.locked)').forEach(card => {
            card.addEventListener('click', () => {
                tg.HapticFeedback.impactOccurred('medium');
            });
        });
    </script>
</body>
</html>
