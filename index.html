<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Шапка */
        .header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid #222;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { 
            width: 40px; height: 40px; border-radius: 50%; 
            border: 2px solid var(--accent-color); overflow: hidden; 
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .balance {
            background: #000;
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid var(--accent-color);
            font-weight: bold;
            color: var(--accent-color);
        }

        /* БЛОК С ПЕРСОНАЖЕМ */
        .character-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }

        .character-container {
            width: 200px;
            height: 200px;
            position: relative;
            animation: float 3s ease-in-out infinite; /* Анимация покачивания */
        }

        .character-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.3));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* КНОПКА МИНИ-ИГР */
        .games-btn-container {
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .games-main-btn {
            background: linear-gradient(135deg, #f1c40f, #d4ac0d);
            color: #000;
            width: 100%;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: 900;
            font-size: 18px;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(241, 196, 15, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .games-main-btn:active { transform: scale(0.96); }

        /* СЕТКА НИЖНИХ КНОПОК */
        .bottom-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .nav-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            border: 1px solid #333;
            cursor: pointer;
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 9px; font-weight: bold; color: var(--text-dim); }
        .nav-item:active { background: #252525; border-color: var(--accent-color); }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-info">
            <div class="user-avatar" id="user-avatar-content">?</div>
            <div id="username" style="font-size: 14px; font-weight: bold;">...</div>
        </div>
        <div class="balance">🧀 <span id="global-points">0</span></div>
    </div>

    <!-- Персонаж -->
    <div class="character-section">
        <div class="character-container">
            <!-- Замени на ссылку на своего нарисованного персонажа -->
            <img src="https://img.icons8.com/isometric/200/rat.png" alt="Hero"> 
        </div>
        <p style="color: var(--text-dim); font-size: 12px; margin-top: 10px;">Статус: Охраняю склады</p>
    </div>

    <!-- Вкладка Мини-игры -->
    <div class="games-btn-container">
        <div class="games-main-btn" onclick="openModule('games_menu.html')">
            🕹️ МИНИ-ИГРЫ
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-grid">
        <div class="nav-item" onclick="alert('Квесты скоро!')">
            <i>📅</i><span>КВЕСТЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Колесо скоро!')">
            <i>🎡</i><span>КОЛЕСО</span>
        </div>
        <div class="nav-item" onclick="openModule('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item" onclick="alert('Магазин скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.headerColor = '#1a1a1a';

        const user = tg.initDataUnsafe?.user;
        const BACKEND_URL = 'https://rat-guard-api.onrender.com';

        if (user) {
            document.getElementById('username').innerText = user.username || user.first_name;
        }

        async function fetchGlobalData() {
            if (!user?.id) return;
            try {
                const url = `${BACKEND_URL}/get_profile/${user.id}?username=${encodeURIComponent(user.username || user.first_name)}&t=${Date.now()}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.points !== undefined) document.getElementById('global-points').innerText = data.points;

                const avatarContent = document.getElementById('user-avatar-content');
                if (data.avatar_url) {
                    avatarContent.innerHTML = `<img src="${data.avatar_url}" alt="ava">`;
                } else {
                    avatarContent.innerText = (user.first_name || "К").charAt(0).toUpperCase();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function openModule(url) { window.location.href = url; }
        fetchGlobalData();
    </script>
</body>
</html>
