<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rat Guard Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent-color: #f1c40f;
            --text-main: #ffffff;
            --text-dim: #888;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            -webkit-user-select: none; 
            user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 100px 20px; /* Добавил отступ снизу под меню */
            box-sizing: border-box;
            gap: 20px;
        }

        .stats-panel {
            text-align: center;
            width: 100%;
        }

        #username { margin: 0; font-size: 20px; color: var(--accent-color); opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }

        .points { 
            font-size: 56px; 
            color: var(--text-main); 
            margin: 15px 0; 
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 0 30px rgba(241, 196, 15, 0.3);
        }

        #clicker-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #rat-button {
            width: 100%;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
            z-index: 10;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.6));
        }

        #rat-button:active { transform: scale(0.90); }

        #click-animation-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .plus-one {
            position: absolute;
            font-weight: 900;
            font-size: 32px;
            opacity: 0;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.8) rotate(15deg); opacity: 0; }
        }

        .error-msg { color: #e74c3c; font-size: 12px; height: 15px; margin-top: 5px; }
        
        .footer-hint {
            color: #444;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* НАВИГАЦИЯ */
        .bottom-grid {
            position: fixed;
            bottom: 0;
            left: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            padding: 10px 20px 25px 20px;
            background: var(--card-bg);
            border-top: 1px solid #333;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-item {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            border: 1px solid #333;
            cursor: pointer;
        }
        .nav-item i { font-style: normal; font-size: 18px; }
        .nav-item span { font-size: 8px; font-weight: bold; color: var(--text-dim); }
        .nav-item.active { border-color: var(--accent-color); background: #222; }
        .nav-item:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-panel">
            <h2 id="username">Загрузка...</h2>
            <div class="points">🧀 <span id="points">0</span></div>
            <div id="error-log" class="error-msg"></div>
        </div>

        <div id="clicker-container">
            <img src="rat_button.png" alt="КРЫСА" id="rat-button" onerror="this.src='https://img.icons8.com/isometric/200/rat.png'">
            <div id="click-animation-area"></div>
        </div>

        <div class="footer-hint">Тапай без остановки!</div>
    </div>

    <!-- Новая навигация -->
    <div class="bottom-grid">
        <div class="nav-item" onclick="goToPath('index.html')">
            <i>🏠</i><span>ДОМ</span>
        </div>
        <div class="nav-item" onclick="goToPath('leaderboard.html')">
            <i>🏆</i><span>ТОП</span>
        </div>
        <div class="nav-item active">
            <i>🕹️</i><span>ИГРЫ</span>
        </div>
        <div class="nav-item" onclick="alert('Скоро!')">
            <i>🛒</i><span>МАГАЗИН</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0f0f0f');

        // Кнопка назад в интерфейсе Телеграм
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            goToPath('games_menu.html');
        });

        function goToPath(path) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            window.location.href = path;
        }

        const BACKEND_URL = 'https://rat-guard-api.onrender.com';
        const user = tg.initDataUnsafe?.user;
        
        const pointsSpan = document.getElementById('points');
        const ratBtn = document.getElementById('rat-button');

        if (user) {
            document.getElementById('username').innerText = user.first_name;
        }

        async function loadProfile() {
            if (!user?.id) return;
            try {
                const response = await fetch(`${BACKEND_URL}/get_profile/${user.id}?t=${Date.now()}`);
                const data = await response.json();
                pointsSpan.innerText = Math.floor(data.points).toLocaleString('ru-RU');
            } catch (e) {
                document.getElementById('error-log').innerText = "Логово временно недоступно";
            }
        }

        async function handleTap(e) {
            let currentPoints = parseInt(pointsSpan.innerText.replace(/\s/g, ''));
            pointsSpan.innerText = (currentPoints + 1).toLocaleString('ru-RU');
            
            spawnCheese(e);
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            try {
                const res = await fetch(`${BACKEND_URL}/click/${user.id}`, { method: 'POST' });
                const data = await res.json();
                if (data.points !== undefined) {
                    pointsSpan.innerText = Math.floor(data.points).toLocaleString('ru-RU');
                }
            } catch (err) {
                console.error("Sync error");
            }
        }

        function spawnCheese(e) {
            const area = document.getElementById('click-animation-area');
            const plus = document.createElement('div');
            plus.className = 'plus-one';
            plus.innerText = '🧀';
            
            const rect = area.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) ? ((e.clientX || e.touches[0].clientX) - rect.left) : (rect.width / 2);
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) ? ((e.clientY || e.touches[0].clientY) - rect.top) : (rect.height / 2);

            plus.style.left = `${x - 15}px`;
            plus.style.top = `${y - 15}px`;

            area.appendChild(plus);
            setTimeout(() => plus.remove(), 700);
        }

        ratBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap(e.touches[0]);
        });
        
        ratBtn.addEventListener('click', (e) => {
            if (e.pointerType !== 'touch') handleTap(e);
        });

        loadProfile();
    </script>
</body>
</html>
