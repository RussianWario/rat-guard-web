<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Склад крысы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 300px; text-align: center; border: 1px solid #333; }
        .points { font-size: 40px; color: #f1c40f; margin: 15px 0; }
        .inventory { background: #111; padding: 10px; border-radius: 10px; font-size: 14px; min-height: 40px; color: #bbb; }
        button { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 20px; cursor: pointer; }
        #error-log { color: #e74c3c; font-size: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="username">Загрузка...</h2>
        <div class="points">🧀 <span id="points">0</span></div>
        <div id="inventory" class="inventory">Ищем вещи...</div>
        <button onclick="window.Telegram.WebApp.close()">Закрыть</button>
        <div id="error-log"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        async function loadProfile() {
            const user = tg.initDataUnsafe?.user;
            const userId = user?.id || 1; 
            const name = user?.first_name || "Крыса";
            
            document.getElementById('username').innerText = name;

            try {
                // Добавляем timestamp, чтобы браузер не кэшировал ответ
                const response = await fetch(`https://rat-guard-api.onrender.com/get_profile/${userId}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
                
                const data = await response.json();
                document.getElementById('points').innerText = data.points;
                document.getElementById('inventory').innerText = data.inventory.join(', ');
            } catch (err) {
                document.getElementById('error-log').innerText = err.message;
                document.getElementById('inventory').innerText = "Ошибка загрузки данных.";
            }
        }

        loadProfile();
    </script>
</body>
</html>
